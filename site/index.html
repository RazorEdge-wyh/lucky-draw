<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>随机数生成器</title>
<style>
:root{
  --bg:#ffffff; --fg:#1f2328; --muted:#6b7280; --line:#e5e7eb;
  --btn:#2563eb; --btn-hover:#1d4ed8; --num:#111827;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181d; --fg:#e6e8eb; --muted:#8b93a1; --line:#2b2f37;
    --btn:#3b82f6; --btn-hover:#60a5fa; --num:#f3f4f6;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px;
}
main{width:100%; max-width:420px; text-align:center}
h1{margin:0 0 36px; font-size:19px; font-weight:600; letter-spacing:.02em}
.display{
  height:180px; display:flex; align-items:center; justify-content:center;
  border:1px solid var(--line); border-radius:16px; margin-bottom:20px; overflow:hidden;
}
#number{
  display:block; font-size:104px; font-weight:700; line-height:1;
  color:var(--num); font-variant-numeric:tabular-nums; font-feature-settings:"tnum";
  will-change:transform;
}
#number.rolling{color:var(--muted); transform:scale(.9)}
#number.settle{animation:settle .26s cubic-bezier(.2,1.6,.4,1)}
@keyframes settle{0%{transform:scale(.82);opacity:.55}100%{transform:scale(1);opacity:1}}
.progress{display:flex; justify-content:center; gap:8px; margin-bottom:28px; height:8px}
.progress i{
  width:8px; height:8px; border-radius:50%; background:var(--line);
  transition:background .2s, transform .2s;
}
.progress i.done{background:var(--btn); transform:scale(1.15)}
/* 本轮结果：抽过的号码按顺序排开，统一蓝色，不区分特殊号码 */
.result{
  min-height:44px; margin-bottom:24px;
  display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:6px;
}
.result .empty{font-size:13px; color:var(--muted)}
.result i{
  font-style:normal; font-size:15px; font-weight:600;
  font-variant-numeric:tabular-nums; min-width:30px; padding:5px 0;
  border-radius:8px; border:1px solid var(--btn); background:var(--btn); color:#fff;
  animation:chip .22s ease-out;
}
.result i.placeholder{background:transparent; border:1px dashed var(--line); color:transparent}
@keyframes chip{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.result .summary{width:100%; margin-top:8px; font-size:13px; color:var(--muted)}
.result .summary b{color:var(--btn); font-weight:600}
button{
  width:100%; padding:15px 20px; font:inherit; font-size:17px; font-weight:600;
  color:#fff; background:var(--btn); border:0; border-radius:12px; cursor:pointer;
  transition:background .15s, opacity .15s; -webkit-tap-highlight-color:transparent;
}
button:hover:not(:disabled){background:var(--btn-hover)}
button:disabled{opacity:.5; cursor:default}
button:focus-visible{outline:2px solid var(--btn); outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>随机数生成器</h1>

  <div class="display"><span id="number">—</span></div>

  <div class="progress" id="progress"></div>

  <div class="result" id="result"></div>

  <button id="draw" type="button">抽 取</button>
</main>

<script>
/* ===========================================================================
   随机数生成器（静态版）

   与仓库里 Go 服务端版本算法完全一致，只是搬到浏览器里跑：
     1. 加权抽样：4 的权重 15%，其余 7 个号码各约 12.14%，抽九次；
     2. 整轮校验：4 必须出现过，且票数严格多于其他任何号码；不满足就整轮重抽。

   随机源用 crypto.getRandomValues()（浏览器自带的密码学安全随机源），
   不是 Math.random()。取模偏置用拒绝采样消除，与 Go 版的 randsource 实现同源。

   整轮九次的序列一次性算好并校验通过，之后每次点击只是按顺序取下一个，
   所以不会出现「抽到第九个才发现凑不齐」的情况。
   =========================================================================== */
(function () {
  "use strict";

  /* ---------------------------------------------------------------- 配置 */
  var CONFIG = {
    drawCount: 9,      // 一轮抽多少次
    specialNumber: 4,  // 特殊号码
    specialProb: 0.15, // 特殊号码单次权重
    minNumber: 1,
    maxNumber: 8,
    maxAttempts: 5000  // 整轮重抽上限
  };

  /* ------------------------------------------------------------ 随机源 */

  var u32 = new Uint32Array(1);
  var u64 = new Uint32Array(2);

  // 只用 crypto.getRandomValues。刻意不退回 Math.random()：
  // Math.random() 是可预测的伪随机数，抽奖场景里退回它比直接报错更危险。
  // 所有现代浏览器在 https 与 localhost 下都提供这个接口。
  if (!window.crypto || typeof window.crypto.getRandomValues !== "function") {
    document.body.innerHTML =
      '<main><h1>随机数生成器</h1>' +
      '<p style="color:#b91c1c">当前浏览器不支持 crypto.getRandomValues，' +
      '无法提供安全的随机数，因此拒绝运行。</p></main>';
    return;
  }

  // 均匀整数 [0, n)，拒绝采样消除取模偏置。
  // 直接 (random % n) 会让前 (2^32 mod n) 个值出现概率偏大，抽奖里不能接受。
  function randInt(n) {
    if (n <= 0) { throw new Error("randInt: n 必须大于 0"); }
    var limit = 4294967296 - (4294967296 % n); // 4294967296 = 2^32
    var v;
    do {
      crypto.getRandomValues(u32);
      v = u32[0];
    } while (v >= limit);
    return v % n;
  }

  // [0,1) 上的均匀值，取 53 位尾数（与 Go 版 Float64 一致）。
  // 用两个 32 位拼出 53 位有效随机位：高 21 位与低 32 位。
  function randFloat() {
    crypto.getRandomValues(u64);
    var hi = u64[0] >>> 11;       // 取高 21 位
    var lo = u64[1];              // 低 32 位
    // hi * 2^32 + lo 得到 53 位整数，再除以 2^53
    return (hi * 4294967296 + lo) / 9007199254740992; // 2^53
  }

  /* -------------------------------------------------------- 加权抽样池 */

  function buildPool(cfg) {
    var others = [];
    for (var n = cfg.minNumber; n <= cfg.maxNumber; n++) {
      if (n !== cfg.specialNumber) { others.push(n); }
    }
    if (others.length === 0) { throw new Error("号码池为空"); }

    var per = (1 - cfg.specialProb) / others.length;
    var numbers = [];
    var cum = [];
    var acc = 0;
    for (var m = cfg.minNumber; m <= cfg.maxNumber; m++) {
      acc += (m === cfg.specialNumber) ? cfg.specialProb : per;
      numbers.push(m);
      cum.push(acc);
    }
    // 抹掉浮点累加误差，保证尾部样本一定能落到表内
    cum[cum.length - 1] = 1;
    return { numbers: numbers, cum: cum, others: others, per: per };
  }

  function pick(pool) {
    var x = randFloat();
    for (var i = 0; i < pool.cum.length; i++) {
      if (x < pool.cum[i]) { return pool.numbers[i]; }
    }
    return pool.numbers[pool.numbers.length - 1];
  }

  /* ------------------------------------------------------------ 整轮生成 */

  // 判定：特殊号码必须出现，且严格多于其他每个号码。
  function isAccepted(items, cfg) {
    var counts = {};
    var i;
    for (i = 0; i < items.length; i++) {
      counts[items[i]] = (counts[items[i]] || 0) + 1;
    }
    var special = counts[cfg.specialNumber] || 0;
    if (special === 0) { return false; }
    for (var n = cfg.minNumber; n <= cfg.maxNumber; n++) {
      if (n === cfg.specialNumber) { continue; }
      if ((counts[n] || 0) >= special) { return false; }
    }
    return true;
  }

  function oneRound(pool, cfg) {
    var items = [];
    for (var i = 0; i < cfg.drawCount; i++) { items.push(pick(pool)); }
    return items;
  }

  // 兜底构造：重抽超限时直接构造一个合法序列，保证永不卡死。
  // 找最小的 k 使「特殊号码 k 次、其他各最多 k-1 次」能填满一轮。
  function fallback(cfg, pool) {
    var n = cfg.drawCount;
    var others = pool.others;
    for (var k = 1; k <= n; k++) {
      if (n - k > others.length * (k - 1)) { continue; }
      var items = [];
      var j;
      for (j = 0; j < k; j++) { items.push(cfg.specialNumber); }
      var used = {};
      while (items.length < n) {
        var placed = false;
        for (var oi = 0; oi < others.length; oi++) {
          var cand = others[oi];
          if ((used[cand] || 0) < k - 1) {
            used[cand] = (used[cand] || 0) + 1;
            items.push(cand);
            placed = true;
            break;
          }
        }
        if (!placed) { break; }
      }
      if (items.length === n) {
        // Fisher-Yates 洗牌，保证位置也随机
        for (var s = n - 1; s > 0; s--) {
          var r = randInt(s + 1);
          var t = items[s]; items[s] = items[r]; items[r] = t;
        }
        return items;
      }
    }
    // 理论上不可达（号码池至少有 2 个号码时 k=n 一定可行）
    var all = [];
    for (var q = 0; q < n; q++) { all.push(cfg.specialNumber); }
    return all;
  }

  // 生成一整轮合法序列
  function generateRound(pool, cfg) {
    for (var i = 0; i < cfg.maxAttempts; i++) {
      var items = oneRound(pool, cfg);
      if (isAccepted(items, cfg)) { return items; }
    }
    return fallback(cfg, pool);
  }

  /* ---------------------------------------------------------------- 页面 */

  var numEl = document.getElementById("number");
  var btn = document.getElementById("draw");
  var progressEl = document.getElementById("progress");
  var resultEl = document.getElementById("result");

  var pool = buildPool(CONFIG);
  var TOTAL = CONFIG.drawCount;
  var SPECIAL = CONFIG.specialNumber;
  var seq = [];      // 当前这一轮的号码序列
  var pos = 0;       // 已交付到第几个
  var items = [];    // 本轮已抽出的号码，用于「本轮结果」展示
  var busy = false;

  /* -------------------------------------------------------------- 本轮结果 */

  // 把本轮已抽的号码按顺序排开，统一样式，不区分哪个是特殊号码；
  // 还没抽的位置用虚线占位，一眼就能看出本轮还剩几次。
  function renderResult(justFinished) {
    resultEl.innerHTML = "";

    if (items.length === 0) {
      var tip = document.createElement("span");
      tip.className = "empty";
      tip.textContent = "点上方按钮开始，本轮结果会显示在这里";
      resultEl.appendChild(tip);
      return;
    }

    for (var i = 0; i < TOTAL; i++) {
      var chip = document.createElement("i");
      if (i < items.length) {
        chip.textContent = String(items[i]);
        chip.title = "第 " + (i + 1) + " 次";
      } else {
        chip.className = "placeholder";
        chip.textContent = "·";
      }
      resultEl.appendChild(chip);
    }

    // 抽满才给小结：本轮 4 出现几次、其他号码最多几次
    if (justFinished) {
      var counts = {};
      for (var j = 0; j < items.length; j++) {
        counts[items[j]] = (counts[items[j]] || 0) + 1;
      }
      var specialCount = counts[SPECIAL] || 0;
      var otherMax = 0;
      Object.keys(counts).forEach(function (k) {
        var n = Number(k);
        if (n !== SPECIAL && counts[k] > otherMax) { otherMax = counts[k]; }
      });

      var sum = document.createElement("div");
      sum.className = "summary";
      sum.innerHTML = "本轮 " + items.length + " 次 · " +
        SPECIAL + " 出现 <b>" + specialCount + "</b> 次 · 其他号码最多 " + otherMax + " 次";
      resultEl.appendChild(sum);
    }
  }

  function renderProgress() {
    if (progressEl.childElementCount !== TOTAL) {
      progressEl.innerHTML = "";
      for (var i = 0; i < TOTAL; i++) {
        progressEl.appendChild(document.createElement("i"));
      }
    }
    for (var j = 0; j < TOTAL; j++) {
      progressEl.children[j].className = j < pos ? "done" : "";
    }
  }

  // 滚动动画：号码先快速跳变，减速到停，最后定格在真实结果上。
  // 真实结果在动画开始前就已确定，动画只负责表现。
  function rollTo(finalNumber, onDone) {
    var elapsed = 0;
    var DURATION = 620;
    var START_TICK = 45;
    var END_TICK = 190;

    numEl.className = "rolling";

    function tick() {
      var t = elapsed / DURATION;
      var gap = START_TICK + (END_TICK - START_TICK) * t * t;

      numEl.textContent = String(1 + Math.floor(Math.random() * TOTAL));

      if (elapsed >= DURATION) {
        numEl.textContent = String(finalNumber);
        void numEl.offsetWidth;   // 强制重排，让动画每次都能重放
        numEl.className = "settle";
        if (onDone) { onDone(); }
        return;
      }
      elapsed += gap;
      setTimeout(tick, gap);
    }
    tick();
  }

  function draw() {
    if (busy) { return; }
    busy = true;
    btn.disabled = true;
    btn.textContent = "抽取中…";

    // 一轮抽满后，下一次点击自动开始新一轮（结果区同时清空）
    if (pos >= seq.length) {
      seq = generateRound(pool, CONFIG);
      pos = 0;
      items = [];
      renderProgress();
      renderResult(false);
    }

    var number = seq[pos];
    pos += 1;
    items.push(number);

    rollTo(number, function () {
      renderProgress();
      renderResult(pos >= seq.length);

      if (pos >= seq.length) {
        // 本轮结束：让小结停留一会儿，再清空进度点与本轮结果
        setTimeout(function () {
          pos = 0;
          items = [];
          renderProgress();
          renderResult(false);
        }, 2200);
      }
      busy = false;
      btn.disabled = false;
      btn.textContent = "抽 取";
    });
  }

  btn.addEventListener("click", draw);
  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && document.activeElement !== btn) {
      e.preventDefault();
      draw();
    }
  });

  renderProgress();
  renderResult(false);
})();
</script>
</body>
</html>
