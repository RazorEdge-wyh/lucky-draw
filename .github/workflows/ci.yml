name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# 同一分支上新的推送会取消旧的构建，避免排队浪费额度。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  test:
    name: 测试与静态检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: 校验 go.mod 是否整洁
        run: |
          # 本项目零外部依赖，因此正常情况下根本没有 go.sum 文件。
          # 不能直接对 go.sum 跑 git diff：路径不存在时 git 会以 128 退出，
          # 在 bash -e 下会把这个「文件不存在」误判成校验失败。
          # 改成用 git status 观察 tidy 前后是否有任何变化，与文件是否存在无关。
          go mod tidy
          if [ -n "$(git status --porcelain -- go.mod go.sum)" ]; then
            echo "::error::go.mod / go.sum 与代码不同步，请在本地执行 go mod tidy 后提交"
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi
          echo "go.mod 整洁（无外部依赖，go.sum 不存在属正常）"

      - name: 检查代码格式
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未格式化，请执行 gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: 单元测试（含竞态检测）
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...

      - name: 覆盖率摘要
        run: |
          go tool cover -func=coverage.out | tail -n 1
          {
            echo "## 测试覆盖率"
            echo '```'
            go tool cover -func=coverage.out | tail -n 20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 构建二进制
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${GITHUB_SHA::7}" \
            -o lucky-draw .

      - name: 冒烟测试（启动服务并打真实请求）
        run: |
          ./lucky-draw -check
          PORT=18080 ./lucky-draw &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz > /dev/null; then break; fi
            sleep 0.5
          done

          echo "--- /healthz ---"
          curl -fsS http://127.0.0.1:18080/healthz

          echo "--- 首页 ---"
          curl -fsS http://127.0.0.1:18080/ | head -c 200

          echo ""
          echo "--- 连抽十二轮并校验规则 ---"
          echo "（规则两条：每轮第一个号码固定为号池上界 8；其余位置为等概率随机。"
          echo "  因此首位必须恒为 8，其余位置的分布必须均匀。）"
          jar="$(mktemp)"
          python3 -c '
          import json, subprocess, sys, collections
          jar = sys.argv[1]
          base = "http://127.0.0.1:18080/api/draw"
          dist = collections.Counter()   # 只统计第 2..9 位
          rest = 0
          rounds = 12

          for r in range(rounds):
              for i in range(1, 10):
                  out = subprocess.run(["curl", "-fsS", "-c", jar, "-b", jar, base],
                                       capture_output=True, text=True, check=True).stdout
                  d = json.loads(out)
                  assert d["index"] == i, "第 %d 轮第 %d 次 index 应为 %d，实际 %d" % (r + 1, i, i, d["index"])
                  assert 1 <= d["number"] <= 8, "号码越界: %s" % d["number"]
                  assert d["total"] == 9, "一轮应为 9 次，实际 %s" % d["total"]
                  assert d["roundDone"] == (i == 9), "第 %d 次 roundDone 错误: %s" % (i, d["roundDone"])

                  if i == 1:
                      # 首位固定规则：号码必须是 8，且接口要如实声明这条规则
                      assert d["number"] == 8, "第 %d 轮第一个号码应为 8，实际 %d" % (r + 1, d["number"])
                      assert d["firstFixed"] == 8, "第 %d 轮 firstFixed 应为 8，实际 %s" % (r + 1, d["firstFixed"])
                      assert d["firstFixedHint"], "首位固定时 firstFixedHint 不应为空"
                  else:
                      dist[d["number"]] += 1
                      rest += 1

          print("首位校验通过：%d 轮的第一个号码全部为 8" % rounds)
          print("其余位置共 %d 次：" % rest)
          for n in range(1, 9):
              print("  号码 %d -> %d 次 (%.1f%%)" % (n, dist[n], 100.0 * dist[n] / rest))

          missing = [n for n in range(1, 9) if dist[n] == 0]
          assert not missing, "这些号码在第 2..9 位从未出现（均匀随机下不该发生）: %s" % missing

          # 12 轮 × 8 = 96 次，单个号码占比的标准差约 0.034，
          # 取 1/8 ± 0.14 是很宽松的区间：不会误报，但能抓出系统性偏向。
          want = 1.0 / 8.0
          for n in range(1, 9):
              share = dist[n] / float(rest)
              assert abs(share - want) <= 0.14, \
                  "号码 %d 在其余位置的占比 %.3f 明显偏离均匀值 %.3f" % (n, share, want)

          # 关键回归断言：如果又变回「每轮必中 4」，4 的占比会接近 37%。
          share4 = dist[4] / float(rest)
          assert share4 < 0.25, "号码 4 占比 %.3f 偏高，像是重新启用了有偏模式" % share4
          print("其余位置均匀性通过：4 的占比 %.3f" % share4)
          ' "$jar"

          echo "--- 已删除的接口应返回 404 ---"
          for p in /api/meta /api/simulate; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18080$p")"
            test "$code" = "404" || { echo "$p 期望 404，实际 $code"; exit 1; }
          done
          echo "旧接口均已下线"

          echo "--- 有偏模式（备份算法）仍可用：SPECIAL_NUMBER=4 ---"
          PORT=18082 SPECIAL_NUMBER=4 ./lucky-draw &
          biased_pid=$!
          trap 'kill $server_pid $biased_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18082/healthz > /dev/null; then break; fi
            sleep 0.5
          done

          jar2="$(mktemp)"
          python3 -c '
          import json, subprocess, sys, collections
          jar = sys.argv[1]
          base = "http://127.0.0.1:18082/api/draw"
          for r in range(10):
              items = []
              for i in range(1, 10):
                  out = subprocess.run(["curl", "-fsS", "-c", jar, "-b", jar, base],
                                       capture_output=True, text=True, check=True).stdout
                  items.append(json.loads(out)["number"])
              c = collections.Counter(items)
              assert c[4] > 0, "有偏模式第 %d 轮没有命中 4: %s" % (r + 1, items)
              other = max(v for k, v in c.items() if k != 4)
              assert c[4] > other, "有偏模式第 %d 轮 4 不是唯一最高票: %s" % (r + 1, items)
          print("备份的有偏算法仍然可用：10 轮全部必中 4 且 4 为唯一最高票")
          ' "$jar2"

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

  docker:
    name: 构建容器镜像
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 只在 CI 里验证镜像能构建成功，不推送到任何仓库。
      - name: 构建（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: lucky-draw:ci
          build-args: |
            VERSION=ci-${GITHUB_SHA::7}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动镜像并做健康检查
        run: |
          docker run -d --name lucky-draw-ci -p 18081:8080 lucky-draw:ci
          trap 'docker logs lucky-draw-ci || true; docker rm -f lucky-draw-ci || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/healthz > /dev/null; then break; fi
            sleep 1
          done

          echo "--- 健康检查 ---"
          curl -fsS http://127.0.0.1:18081/healthz

          echo ""
          echo "--- 首页 ---"
          curl -fsS http://127.0.0.1:18081/ | grep -o "随机数生成器" | head -1

          echo "--- 连抽九次（同一轮）---"
          jar="$(mktemp)"
          for i in $(seq 1 9); do
            curl -fsS -c "$jar" -b "$jar" http://127.0.0.1:18081/api/draw
          done
          echo "容器镜像运行正常"
