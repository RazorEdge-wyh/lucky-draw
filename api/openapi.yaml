openapi: 3.0.3

info:
  title: 随机数生成器 API
  version: 2.0.0
  description: |
    点一下，抽一个数字。**九次为一轮，一轮一定命中 4。**

    规则：号码池 1–8，特殊号码为 4。一轮九次抽完后，
    4 必定出现过，且票数严格多于其他任何号码。

    ⚠️ 这不是均匀等概率抽奖。4 是否「中奖」由规则决定，随机只决定其余号码的分布。

    服务端用 `ld_sid` Cookie 记住「本轮抽到第几个」。不带 Cookie 的请求每次都会开始新一轮。

servers:
  - url: http://localhost:8080
    description: 本地

tags:
  - name: draw
    description: 抽取
  - name: ops
    description: 运维探针

paths:
  /api/draw:
    get:
      tags: [draw]
      summary: 抽下一个号码
      description: |
        返回本轮的下一个号码。首次请求（或上一轮已抽满）会自动开始新一轮，
        并通过 `Set-Cookie: ld_sid=...` 下发会话标识。
      operationId: draw
      responses:
        "200":
          description: 抽取成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrawResponse"
              example:
                number: 4
                index: 3
                total: 9
                roundDone: false
                round: 1
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
    post:
      tags: [draw]
      summary: 抽下一个号码（与 GET 等价）
      operationId: drawPost
      responses:
        "200":
          description: 抽取成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrawResponse"

  /api/reset:
    get:
      tags: [draw]
      summary: 放弃当前进度，重新开始一轮
      operationId: reset
      responses:
        "200":
          description: 已重置
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true

  /healthz:
    get:
      tags: [ops]
      summary: 存活探针
      operationId: healthz
      responses:
        "200":
          description: 服务正常
          content:
            text/plain:
              schema:
                type: string
                example: ok

components:
  responses:
    MethodNotAllowed:
      description: 方法不允许
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    DrawResponse:
      type: object
      required: [number, index, total, roundDone, round]
      properties:
        number:
          type: integer
          description: 本次抽出的号码
          minimum: 1
          example: 4
        index:
          type: integer
          description: 这是本轮第几次，取值 1..total
          example: 3
        total:
          type: integer
          description: 一轮抽多少次
          example: 9
        roundDone:
          type: boolean
          description: 本轮是否已抽满；第九次为 true
          example: false
        round:
          type: integer
          description: 当前是第几轮，从 1 开始
          example: 1

    ErrorResponse:
      type: object
      required: [error, status]
      properties:
        error:
          type: string
          example: 只支持 GET / POST
        status:
          type: integer
          example: 405
