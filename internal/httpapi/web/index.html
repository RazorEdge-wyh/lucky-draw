<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>随机数生成器</title>
<style>
:root{
  --bg:#ffffff;
  --fg:#1f2328;
  --muted:#6b7280;
  --line:#e5e7eb;
  --btn:#2563eb;
  --btn-hover:#1d4ed8;
  --num:#111827;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181d;
    --fg:#e6e8eb;
    --muted:#8b93a1;
    --line:#2b2f37;
    --btn:#3b82f6;
    --btn-hover:#60a5fa;
    --num:#f3f4f6;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:24px;
}
main{
  width:100%;
  max-width:420px;
  text-align:center;
}
h1{
  margin:0 0 36px;
  font-size:19px;
  font-weight:600;
  letter-spacing:.02em;
}
/* 号码显示区：固定高度，避免数字变化导致页面抖动 */
.display{
  height:180px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--line);
  border-radius:16px;
  margin-bottom:20px;
  overflow:hidden;
}
#number{
  display:block;
  font-size:104px;
  font-weight:700;
  line-height:1;
  color:var(--num);
  font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum";
  will-change:transform;
}
/* 滚动中：变灰、轻微缩小，看着像在"转" */
#number.rolling{
  color:var(--muted);
  transform:scale(.9);
}
/* 定格：弹一下 */
#number.settle{
  animation:settle .26s cubic-bezier(.2,1.6,.4,1);
}
@keyframes settle{
  0%{transform:scale(.82);opacity:.55}
  100%{transform:scale(1);opacity:1}
}
/* 进度：九个点 */
.progress{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-bottom:28px;
  height:8px;
}
.progress i{
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--line);
  transition:background .2s,transform .2s;
}
.progress i.done{
  background:var(--btn);
  transform:scale(1.15);
}
/* 本轮结果：抽过的号码按顺序排开，抽到 4 时高亮 */
.result{
  min-height:44px;
  margin-bottom:24px;
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:6px;
}
.result .empty{
  font-size:13px;
  color:var(--muted);
}
.result i{
  font-style:normal;
  font-size:15px;
  font-weight:600;
  font-variant-numeric:tabular-nums;
  min-width:30px;
  padding:5px 0;
  border-radius:8px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--fg);
  animation:chip .22s ease-out;
}
.result i.special{
  background:var(--btn);
  border-color:var(--btn);
  color:#fff;
}
.result i.placeholder{
  border-style:dashed;
  color:transparent;
}
@keyframes chip{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
/* 本轮小结，只在抽满九次后出现 */
.result .summary{
  width:100%;
  margin-top:8px;
  font-size:13px;
  color:var(--muted);
}
.result .summary b{color:var(--btn);font-weight:600}
button{
  width:100%;
  padding:15px 20px;
  font:inherit;
  font-size:17px;
  font-weight:600;
  color:#fff;
  background:var(--btn);
  border:0;
  border-radius:12px;
  cursor:pointer;
  transition:background .15s,opacity .15s;
  -webkit-tap-highlight-color:transparent;
}
button:hover:not(:disabled){background:var(--btn-hover)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid var(--btn);outline-offset:3px}
</style>
</head>
<body>
<main>
  <h1>随机数生成器</h1>

  <div class="display"><span id="number">—</span></div>

  <div class="progress" id="progress"></div>

  <div class="result" id="result"></div>

  <button id="draw" type="button">抽 取</button>
</main>

<script src="/app.js"></script>
</body>
</html>
